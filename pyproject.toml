[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-vllm-client"
version = "0.1.0"
description = "OpenAI-compatible client and Triton DSL grammar helpers for Modal vLLM inference."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "xgrammar>=0.1.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modal_vllm*"]

[tool.setuptools.package-data]
"modal_vllm.grammar" = ["*.ebnf"]
